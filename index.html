<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>B-CAD 2026 · Gestione Contatti</title>
<style>
:root{--bg:#f5f4f0;--card:#fff;--card2:#eeede8;--text:#18181a;--t2:#6b6a66;--t3:#9a9890;--bd:#e2dfd6;--bd2:#c8c5bc;--r:10px;--blue:#185FA5;--blue-bg:#E6F1FB}
@media(prefers-color-scheme:dark){:root{--bg:#18181a;--card:#242422;--card2:#1e1e1c;--text:#f0ede8;--t2:#9a9890;--t3:#6a6a60;--bd:#38382e;--bd2:#48483e}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
#app{max-width:430px;margin:0 auto;min-height:100vh}

/* LOGIN */
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:28px 20px}
.login-eye{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--t3);margin-bottom:6px}
.login-title{font-size:22px;font-weight:500;margin-bottom:4px;text-align:center}
.login-sub{font-size:13px;color:var(--t2);margin-bottom:28px;text-align:center}
.login-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.lbtn{padding:14px 8px;border-radius:var(--r);border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;text-align:center}
.lbtn:hover{background:var(--card2)}
.lbtn.admin{grid-column:span 2;background:var(--blue);color:#fff;border-color:var(--blue)}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20}
.hdr-t{font-size:14px;font-weight:600}
.hdr-s{font-size:11px;color:var(--t2);margin-top:1px}
.out-btn{padding:5px 11px;border-radius:6px;border:1px solid var(--bd);background:none;color:var(--t2);font-size:12px;cursor:pointer}

/* TABS */
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:56px;z-index:19}
.tab{flex:1;padding:10px 2px;border:none;background:none;color:var(--t2);font-size:12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}

/* CONTENT */
.body{padding:14px 14px 80px}

/* CARDS */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:13px 15px;margin-bottom:10px}
.clabel{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:.05em;margin-bottom:9px}

/* CHIPS */
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:500;white-space:nowrap;margin:1px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;white-space:nowrap}

/* FILTER BAR */
.fbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fbtn{padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--t2);font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.fbtn.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* CONTACT ITEMS */
.ci{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:11px 13px;margin-bottom:8px;cursor:pointer;position:relative}
.ci:hover{border-color:var(--bd2)}
.ci-name{font-size:14px;font-weight:500;margin-bottom:1px}
.ci-meta{font-size:11px;color:var(--t2);margin-bottom:6px}
.ci-chips{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:4px}
.ci-nota{font-size:11px;color:var(--t3);font-style:italic;margin-top:3px}
.ci-bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.warn-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#FAEEDA;border:1px solid #BA7517;margin-left:4px;vertical-align:middle}

/* DIST GRID */
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.di{text-align:center;padding:10px 4px;background:var(--card2);border-radius:8px}
.di-n{font-size:20px;font-weight:500}
.di-l{font-size:10px;color:var(--t2);margin-top:2px}

/* BUTTONS */
.btn{display:block;width:100%;padding:12px;border-radius:var(--r);border:none;font-size:14px;font-weight:500;cursor:pointer;text-align:center;font-family:inherit}
.btn-blue{background:var(--blue);color:#fff}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--bd)}
.btn-rand{position:fixed;bottom:20px;right:20px;width:auto;padding:12px 20px;border-radius:99px;background:var(--blue);color:#fff;border:none;font-size:13px;font-weight:500;cursor:pointer;box-shadow:0 4px 14px rgba(24,95,165,.35);z-index:50}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end}
.sheet{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-height:94vh;overflow-y:auto;padding-bottom:28px}
.sh-handle{width:36px;height:4px;background:var(--bd2);border-radius:99px;margin:12px auto 0}
.sh-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.sh-title{font-size:16px;font-weight:500}
.sh-close{width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);background:var(--card2);color:var(--t2);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sh-body{padding:0 16px}

/* CALL SHEET */
.contact-card{background:var(--card2);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.cc-name{font-size:15px;font-weight:500;margin-bottom:2px}
.cc-meta{font-size:12px;color:var(--t2);line-height:1.7}
.nota-box{background:var(--card2);border-left:3px solid var(--bd2);border-radius:0 8px 8px 0;padding:9px 12px;font-size:12px;color:var(--t2);margin-bottom:10px;line-height:1.5}

/* SEGMENTED */
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;width:100%;margin-top:6px}
.sbtn{flex:1;padding:10px 3px;border:none;border-right:1px solid var(--bd);background:var(--card2);color:var(--t2);font-size:11px;cursor:pointer;text-align:center}
.sbtn:last-child{border-right:none}
.sbtn.act.caldo{background:#FAECE7;color:#993C1D;font-weight:600}
.sbtn.act.possibile{background:#FAEEDA;color:#854F0B;font-weight:600}
.sbtn.act.nonora{background:var(--card);color:var(--t3);font-weight:500}

/* CONCRETE */
.concrete-btn{width:100%;padding:12px;border-radius:8px;border:2px solid var(--bd);background:var(--card);color:var(--t2);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit}
.concrete-btn.on{background:#EAF3DE;color:#27500A;border-color:#639922}

/* FORM ELEMENTS */
.fselect{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit;outline:none}
.ftextarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit;resize:none;outline:none;line-height:1.5}

/* STATS */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.scard{background:var(--card2);border-radius:8px;padding:12px}
.sn{font-size:24px;font-weight:500}
.sl{font-size:11px;color:var(--t2);margin-top:2px}
.prog-wrap{width:100%;height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0}
.prog-fill{height:100%;border-radius:99px;background:var(--blue)}

/* TEAM */
.tr{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.tr:last-child{border-bottom:none}
.tr-name{font-size:12px;font-weight:500;flex:0 0 85px}
.tr-ratio{font-size:11px;color:var(--t2);flex:0 0 44px}
.tr-bar{flex:1;height:5px;background:var(--card2);border-radius:99px;overflow:hidden}
.tr-fill{height:100%;border-radius:99px;background:var(--blue)}
.tr-pos{font-size:11px;color:#3B6D11;font-weight:600;flex:0 0 34px;text-align:right}

/* BACHECA */
.msg{background:var(--card2);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.msg-hdr{display:flex;justify-content:space-between;margin-bottom:3px}
.msg-who{font-size:11px;font-weight:600}
.msg-when{font-size:11px;color:var(--t3)}
.msg-body{font-size:13px;color:var(--t2);line-height:1.5}
.msg-body .tag{color:var(--blue);font-weight:500}
.msg-compose{display:flex;gap:8px;margin-top:10px}
.msg-in{flex:1;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit;outline:none}
.msg-send{padding:10px 16px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-size:13px;cursor:pointer}

/* MISC */
.empty{text-align:center;padding:40px 20px;color:var(--t2);font-size:13px}
.divider{height:1px;background:var(--bd);margin:10px 0}
.prow{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd)}
.prow:last-child{border-bottom:none}
.pname{font-size:12px}
.pval{font-size:13px;font-weight:500;color:var(--blue)}
.c-ita{background:#EEEDFE;color:#3C3489}
.c-v{background:#E6F1FB;color:#0C447C}
.c-h{background:#FBEAF0;color:#72243E}
.c-s{background:#FAEEDA;color:#633806}
.c-eu{background:#FAECE7;color:#4A1B0C}
.c-tf{background:#EAF3DE;color:#27500A}
.c-in{background:#E1F5EE;color:#085041}
.bc{background:#EAF3DE;color:#27500A}
.bw{background:#FAEEDA;color:#854F0B}
.br{background:#FAECE7;color:#993C1D}
.bg{background:#E6F1FB;color:#185FA5}
.bp{background:var(--card2);color:var(--t2);border:1px solid var(--bd)}
.search-wrap{position:relative;margin-bottom:12px}
.search-inp{width:100%;padding:9px 34px 9px 12px;border:1px solid var(--bd);border-radius:var(--r);background:var(--card);color:var(--text);font-size:13px;font-family:inherit;outline:none}
.search-inp:focus{border-color:var(--bd2)}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--t3);cursor:pointer;font-size:15px;line-height:1;padding:0}
.esito-opt.sel-parlato{background:#EAF3DE!important;color:#27500A!important;border-color:#639922!important}
.esito-opt.sel-richiama{background:#FAEEDA!important;color:#854F0B!important;border-color:#BA7517!important}
.esito-opt.sel-nr{background:var(--card2)!important;color:var(--t2)!important;border-color:var(--bd2)!important;font-weight:600!important}
.esito-opt.sel-chiuso{background:#FAECE7!important;color:#993C1D!important;border-color:#D85A30!important}
#close-call-btn:not(:disabled){opacity:1!important}
@keyframes bcadspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PKEYS=['v','h','s','eu','tf','in'];
const PNAMES={v:'Vaillant',h:'Helty',s:'Sunerg',eu:'Eurotherm',tf:'Thermofloc','in':'Internorm',ita:'ITA'};
const PCLS={v:'c-v',h:'c-h',s:'c-s',eu:'c-eu',tf:'c-tf','in':'c-in',ita:'c-ita'};
const PBAR={v:'#185FA5',h:'#A3395E',s:'#BA7517',eu:'#D85A30',tf:'#639922','in':'#1D9E75',ita:'#7F77DD'};
const ADMIN_PIN='2026';
const PTINT={v:'rgba(24,95,165,.06)',h:'rgba(163,57,94,.06)',s:'rgba(186,117,23,.06)',eu:'rgba(216,90,48,.06)',tf:'rgba(99,153,34,.06)',in:'rgba(29,158,117,.06)'};
const HASHROLES={vaillant:'v',helty:'h',sunerg:'s',eurotherm:'eu',thermofloc:'tf',internorm:'in',ita:'ita'};


// ── STATE ──────────────────────────────────────────────
let S={user:null,asgn:{},results:{},msgs:[],contacts:[],modal:null,adminFilter:'unassigned',callerTab:'contacts',activeId:null,callRatings:{},callConcrete:false,callDoc:'',callNote:'',callEsito:'',callerFirstTime:false,msgsSeen:0,signals:{},mixed:{},signalModal:null,campaigns:{},activeCampaign:'bcad2026',adminView:'campaigns',callerView:'landing',fromLogin:false,c2cAsked:'',callC2CRequired:true,adminPin:'',teamStats:[],dataStatus:'idle',dataError:''};

// ── STORAGE (solo preferenze locali del dispositivo — i dati veri vivono nel foglio Google) ──
const GLOBAL_KEYS=['user','activeCampaign'];
function isGlobal(k){return GLOBAL_KEYS.includes(k)||k.startsWith('msgsSeen_')||k.startsWith('seen_');}
function lsave(k,v){try{const fk='bcad_'+(isGlobal(k)?k:(S.activeCampaign||'bcad2026')+'_'+k);localStorage.setItem(fk,JSON.stringify(v))}catch(e){}}
function lload(k,def){try{const fk='bcad_'+(isGlobal(k)?k:(S.activeCampaign||'bcad2026')+'_'+k);const v=localStorage.getItem(fk);return v?JSON.parse(v):def}catch(e){return def}}

function loadState(){
  S.user=lload('user',null);
  S.activeCampaign=lload('activeCampaign','bcad2026');
  S.msgsSeen=lload('msgsSeen_'+(S.user||''),0);
}
function allContacts(){return S.contacts||[]}

// ── BACKEND (Google Apps Script condiviso) ──────────────────────────────
const API_URL='https://script.google.com/macros/s/AKfycby0IW7i2-aoaCQEqYp6jv5kbyHTGzPgjGSKWP1-zFwbRvw8r30wEPFLXN8CI_nmoDom/exec';
function apiGet(params){
  const qs=Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k]==null?'':params[k])).join('&');
  return fetch(API_URL+'?'+qs).then(r=>r.json());
}
function apiPost(action,extra){
  const body=Object.assign({action:action,campaign:S.activeCampaign||'bcad2026'},extra||{});
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(r=>r.json());
}
function truthy_(v){return v===true||v==='TRUE'||v===1||v==='1';}
function mapContact(row){
  return{id:Number(row.id),d:row.giorno||'',n:row.nome||'',c:row.cognome||'',az:row.azienda||'',r:row.ruolo||'',
    m:row.email||'',t:row.telefono||'',
    i:{v:row.interesse_vaillant?1:0,h:row.interesse_helty?1:0,s:row.interesse_sunerg?1:0,eu:row.interesse_eurotherm?1:0,tf:row.interesse_thermofloc?1:0,in:row.interesse_internorm?1:0},
    nota:row.nota||'',warn:row.warn||undefined};
}
function mapChiamata(row){
  return{partner:row.partner,
    ratings:{v:row.rating_vaillant||'',h:row.rating_helty||'',s:row.rating_sunerg||'',eu:row.rating_eurotherm||'',tf:row.rating_thermofloc||'',in:row.rating_internorm||''},
    concrete:truthy_(row.concreto),doc:row.documento||'',note:row.nota||'',esito:row.esito||'',
    callbackDate:row.data_richiamata||'',callDate:row.data_chiamata||'',status:'called',
    reassignedTo:row.riassegnato_a||'',mixed:truthy_(row.misto),
    mixedPartners:(row.misto_partners||'').split(',').filter(Boolean),mixedReferente:truthy_(row.misto_referente)};
}
function applyBootstrapData(data,isAdmin){
  S.contacts=(data.contatti||[]).map(mapContact);
  S.results={};
  (data.chiamate||[]).forEach(r=>{S.results[r.chiave]=mapChiamata(r)});
  S.signals={};
  (data.segnalazioni||[]).forEach(s=>{
    const cid=Number(s.contatto_id);
    if(!S.signals[cid])S.signals[cid]=[];
    S.signals[cid].push({from:s.da,to:s.a,note:s.nota||'',date:s.data||'',consent:true,livello:s.livello||''});
  });
  S.mixed={};
  (data.progettiMisti||[]).forEach(m=>{
    S.mixed[Number(m.contatto_id)]={partners:(m.partners||'').split(',').filter(Boolean),referente:truthy_(m.referente),note:m.nota||'',date:m.data||''};
  });
  S.msgs=(data.messaggi||[]).map(m=>({sender:m.autore,text:m.testo,when:m.data,auto:truthy_(m.auto)}));
  S.asgn={};
  if(isAdmin){
    (data.assegnazioni||[]).forEach(a=>{S.asgn[Number(a.contatto_id)]=a.partner});
    S.campaigns={};
    (data.campagne||[]).forEach(cp=>{S.campaigns[cp.id]={id:cp.id,name:cp.nome,date:cp.data,venue:cp.venue,created:cp.creato}});
    if(!S.campaigns[S.activeCampaign])S.activeCampaign='bcad2026';
  }else{
    (data.partnerContactIds||[]).forEach(id=>{S.asgn[Number(id)]=data.partner});
    S.teamStats=data.teamStats||[];
  }
}
function doBootstrap(){
  const isAdmin=S.user==='admin';
  const params=isAdmin
    ?{action:'bootstrapAdmin',pin:S.adminPin||ADMIN_PIN,campaign:S.activeCampaign||'bcad2026'}
    :{action:'bootstrapPartner',partner:S.user,campaign:S.activeCampaign||'bcad2026'};
  return apiGet(params).then(data=>{
    if(data.error)throw new Error(data.error);
    applyBootstrapData(data,isAdmin);
  });
}
function reloadData(){
  S.dataStatus='loading';render();
  doBootstrap().then(()=>{S.dataStatus='ready';render();})
    .catch(err=>{S.dataStatus='error';S.dataError=(err&&err.message)||String(err);render();});
}
function refreshData(){return doBootstrap();}
function setBusy(msg){
  let el=document.getElementById('busy-overlay');
  if(!el){
    el=document.createElement('div');
    el.id='busy-overlay';
    el.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;display:flex;align-items:center;justify-content:center';
    el.innerHTML='<div style="background:var(--card);padding:18px 24px;border-radius:12px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.2)"><div style="width:16px;height:16px;border:2px solid var(--bd);border-top-color:var(--blue);border-radius:50%;animation:bcadspin .7s linear infinite"></div><span id="busy-text"></span></div>';
    document.body.appendChild(el);
  }
  document.getElementById('busy-text').textContent=msg||'Salvataggio…';
  el.style.display='flex';
}
function clearBusy(){const el=document.getElementById('busy-overlay');if(el)el.style.display='none';}
function renderLoadingScreen(){
  return'<div class="login"><div class="login-eye">B-CAD 2026</div>'
    +'<div style="width:30px;height:30px;border:3px solid var(--bd);border-top-color:var(--blue);border-radius:50%;animation:bcadspin .8s linear infinite;margin:18px auto 0"></div>'
    +'<div style="margin-top:16px;font-size:13px;color:var(--t2)">Caricamento dati…</div></div>';
}
function renderErrorScreen(msg){
  return'<div class="login"><div class="login-eye">B-CAD 2026</div>'
    +'<div class="login-title" style="font-size:16px;color:#993C1D;margin-top:14px">Errore di connessione</div>'
    +'<div class="login-sub">'+esc(msg||'Impossibile contattare il server')+'</div>'
    +'<button class="btn btn-blue" style="max-width:280px;margin-top:16px" onclick="reloadData()">Riprova</button>'
    +'<button class="btn btn-ghost" style="max-width:280px;margin-top:8px" onclick="S.user=null;S.dataStatus=\'idle\';lsave(\'user\',null);render()">Torna al login</button></div>';
}
// Esegue in sequenza una serie di chiamate al backend, poi ricarica i dati e ridisegna.
// steps: array di funzioni che restituiscono una Promise (una chiamata apiPost/apiGet ciascuna)
function apiChain(steps,onDone){
  setBusy('Salvataggio…');
  let p=Promise.resolve();
  steps.forEach(fn=>{p=p.then(res=>{if(res&&res.error)throw new Error(res.error);return fn();});});
  p.then(res=>{
    if(res&&res.error)throw new Error(res.error);
    return refreshData();
  }).then(()=>{
    clearBusy();
    if(onDone)onDone();else render();
  }).catch(err=>{
    clearBusy();
    alert('Errore: '+((err&&err.message)||err));
  });
}

// ── HELPERS ──────────────────────────────────────────────
function intList(c){return c&&c.i?PKEYS.filter(k=>c.i[k]):[]}
function numInt(c){return intList(c).length}
function isMulti(c){return numInt(c)>1}
function statusOf(id,pk){
  pk=pk||S.user||'v';
  // Try per-partner key first, then legacy format
  const r=S.results[rkey(id,pk)]||S.results[id]||null;
  if(!r)return'pending';
  if(r.concrete)return'concrete';
  if(r.esito==='chiuso')return'closed_neg';
  if(r.esito==='richiama')return'callback';
  if(r.esito==='nonrisponde')return'no_answer';
  if(r.esito==='parlato')return'called';
  if(r.status==='called')return'called';
  return'pending';
}
function statusLabel(id,pk){
  const m={pending:'Da chiamare',called:'Chiamato',callback:'Richiamare',no_answer:'Non risponde',closed_neg:'Chiuso',closed:'Chiuso ✓',concrete:'Cliente concreto'};
  return m[statusOf(id,pk)]||'Da chiamare';
}
function statusCls(id,pk){
  const m={pending:'bp',called:'bg',callback:'bw',no_answer:'bp',closed_neg:'br',closed:'bc',concrete:'bc'};
  return m[statusOf(id,pk)]||'bp';
}
function myContacts(pk){return allContacts().filter(c=>S.asgn[c.id]===pk)}
function segnalazioniRicevute(pk){
  // Con il backend condiviso, ogni segnalazione verso pk arriva già come voce in S.signals
  // (il server la genera sia da una valutazione in chiamata sia da una segnalazione rapida).
  return allContacts().filter(c=>{
    if(S.asgn[c.id]===pk)return false;
    const sigs=S.signals[c.id];
    return sigs&&sigs.some(sg=>sg.to===pk);
  });
}
function getSignalInfo(cid,pk){
  // Returns the most relevant signal info for display
  const sigs=S.signals[cid];
  if(sigs){
    const qs=sigs.find(sg=>sg.to===pk);
    if(qs)return{partner:qs.from,note:qs.note,livello:'Segnalato',from:'quick'};
  }
  const r=S.results[cid];
  if(r&&r.ratings&&r.ratings[pk]){
    const rL={caldo:'Confermato',possibile:'Possibile'};
    return{partner:r.partner,note:r.note,livello:rL[r.ratings[pk]]||'Segnalato',from:'call'};
  }
  return null;
}
function unassigned(){return allContacts().filter(c=>!S.asgn[c.id])}
function countFor(pk){return allContacts().filter(c=>S.asgn[c.id]===pk).length}
function calledFor(pk){return myContacts(pk).filter(c=>statusOf(c.id)!=='pending').length}
function positiveFor(pk){return myContacts(pk).filter(c=>statusOf(c.id)==='closed'||statusOf(c.id)==='concrete').length}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function now(){const d=new Date();return d.getHours()+':'+(String(d.getMinutes()).padStart(2,'0'))}
function contactDate(c){return c.d||''}

  const csvBtn=document.getElementById('nc-campcsv-btn');
  const csvInp=document.getElementById('nc-campcsv');
  if(csvBtn&&csvInp){
    csvBtn.onclick=()=>csvInp.click();
    csvInp.onchange=()=>{

    const dateVal=document.getElementById('nc-campdate')?.value||'';
    const venueVal=document.getElementById('nc-campvenue')?.value||'';

    apiPost('createCampaign',{pin:S.adminPin||ADMIN_PIN,id,nome:name,data:dateVal,venue:venueVal,creato:createdVal}).then(res=>{
      if(res.error)throw new Error(res.error);
      S.activeCampaign=id;lsave('activeCampaign',id);
      if(file){
        return new Promise((resolve,reject)=>{
          const reader=new FileReader();
          reader.onload=e=>{importCSV(e.target.result).then(resolve).catch(reject);};
          reader.onerror=reject;
          reader.readAsText(file,'UTF-8');

        clearBusy();

function parseCSV(text){
  const lines=[];
  let cur='',inQ=false;
  const rows=[];
  // Parse respecting quoted fields
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(ch==='"'){inQ=!inQ;}
    else if(ch===','&&!inQ){lines.push(cur);cur='';}
    else if((ch==='\n'||ch==='\r')&&!inQ){
      if(cur||lines.length){lines.push(cur);rows.push([...lines]);lines.length=0;cur='';}
    } else{cur+=ch;}
  }
  if(cur||lines.length){lines.push(cur);rows.push([...lines]);}
  return rows;
}
function importCSV(text){
  const rows=parseCSV(text);
  if(!rows.length)return Promise.resolve({added:0,skipped:0,msg:'File vuoto'});
  // Find header row
  const hdr=rows[0].map(h=>h.trim().toUpperCase());
  const ci=(name)=>hdr.indexOf(name);
  const iNome=ci('NOME'),iCogn=ci('COGNOME'),iAz=ci('AZIENDA'),iRuolo=ci('RUOLO');
  const iMail=ci('MAIL'),iTel=ci('TELEFONO');
  const iV=ci('VAILLANT'),iH=ci('HELTY'),iS=ci('SUNERG'),iEu=ci('EUROTHERM'),iTf=ci('THERMOFLOC'),iIn=ci('INTERNORM');
  const iNota=ci('NOTE'),iData=ci('DATA');
  // Existing emails for dedup
  const existingMails=new Set(allContacts().map(c=>(c.m||'').toLowerCase().trim()).filter(Boolean));
  let maxId=allContacts().reduce((m,c)=>Math.max(m,c.id||0),0);
  let added=0,skipped=0;
  const newRows=[];
  const dataRows=rows.slice(1).filter(r=>r.length>4&&r[iNome||2]?.trim());
  dataRows.forEach(r=>{
    const get=(i)=>i>=0&&i<r.length?r[i].trim():'';
    const mail=get(iMail).toLowerCase();
    if(mail&&existingMails.has(mail)){skipped++;return;}
    // Parse date
    let d='';
    if(iData>=0){
      const parts=get(iData).split('/');
      if(parts.length>=2){
        const mesi=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
        const m=parseInt(parts[1])-1;
        d=parts[0]+' '+(mesi[m]||parts[1]);
      }
    }
    if(!d){
      const now=new Date();
      const mesi=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
      d=now.getDate()+' '+mesi[now.getMonth()];
    }
    const tel=get(iTel).replace(/^0039\s?/,'').replace(/\s/g,'');
    const si=(i)=>get(i).toLowerCase()==='sì'||get(i).toLowerCase()==='si'||get(i)==='1'?1:0;
    maxId++;
    newRows.push({
      id:maxId, giorno:d,
      nome:get(iNome>=0?iNome:2), cognome:get(iCogn>=0?iCogn:3),
      azienda:get(iAz>=0?iAz:4), ruolo:get(iRuolo>=0?iRuolo:5),
      email:get(iMail>=0?iMail:6), telefono:tel,
      interesse_vaillant:si(iV), interesse_helty:si(iH), interesse_sunerg:si(iS),
      interesse_eurotherm:si(iEu), interesse_thermofloc:si(iTf), interesse_internorm:si(iIn),
      nota:get(iNota>=0?iNota:14)
    });
    if(mail)existingMails.add(mail);
    added++;
  });
  if(!newRows.length)return Promise.resolve({added:0,skipped,msg:'Nessun contatto nuovo da importare'+(skipped?' · '+skipped+' già presenti (skip)':'')});
  return apiPost('importContacts',{pin:S.adminPin||ADMIN_PIN,rows:newRows}).then(res=>{
    if(res.error)throw new Error(res.error);
    return{added,skipped,msg:added+' contatti importati'+(skipped?' · '+skipped+' già presenti (skip)':'')};
  });
}
function bindAdmin(){

  const addBtn=document.getElementById('add-btn');
  if(addBtn)addBtn.onclick=()=>{S.modal={type:'addcontact'};render()};

  if(importBtn&&csvInput){
    importBtn.onclick=()=>csvInput.click();
    csvInput.onchange=()=>{
      const file=csvInput.files[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=e=>{
        setBusy('Importazione…');
        importCSV(e.target.result).then(result=>{
          return doBootstrap().then(()=>{
            clearBusy();csvInput.value='';render();
            setTimeout(()=>alert(result.msg),100);
          });
        }).catch(err=>{clearBusy();csvInput.value='';alert('Errore import: '+((err&&err.message)||err));});
      };
      reader.readAsText(file,'UTF-8');
    };
  }
  document.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{S.adminFilter=b.dataset.f;render()});
  document.querySelectorAll('.ci').forEach(item=>item.onclick=()=>{S.modal={type:'assign',cid:parseInt(item.dataset.cid)};render()});

function renderDashboard(pk,my){
  const total=my.length;
  const called=my.filter(c=>statusOf(c.id,pk)!=='pending').length;
  const pos=my.filter(c=>statusOf(c.id)==='closed').length;
  const concrete=my.filter(c=>statusOf(c.id)==='concrete').length;
  const waiting=total-called;
  const pct=total?Math.round(called/total*100):0;
  const segnalazioni={};
  PKEYS.filter(k=>k!==pk).forEach(k=>{segnalazioni[k]=0});
  my.forEach(c=>{
    const r=S.results[rkey(c.id,pk)];
    if(r&&r.ratings)PKEYS.filter(k=>k!==pk).forEach(k=>{if(r.ratings[k]&&r.ratings[k]!=='nonora')segnalazioni[k]++});
  });
  const segRows=PKEYS.filter(k=>k!==pk&&segnalazioni[k]>0).sort((a,b)=>segnalazioni[b]-segnalazioni[a]).map(k=>`<div class="prow"><span class="pname">${PNAMES[k]}</span><span class="pval">${segnalazioni[k]}</span></div>`).join('');
  return`<div>
<div class="clabel" style="margin-bottom:10px">LA MIA SETTIMANA · ${PNAMES[pk]}</div>
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
    <span style="font-size:22px;font-weight:500">${called} <span style="font-size:14px;color:var(--t2)">di ${total} chiamati</span></span>
    <span style="font-size:12px;color:var(--t2)">${pct}%</span>

  <div class="sgrid" style="margin-top:8px">

function getResult(id,pk){return S.results[rkey(id,pk)]||null;}
function getField(c,field){return c[field]}
function profilazioneRecap(pk){
  const rL={caldo:'✓ Confermato',possibile:'~ Possibile',nonora:'— Non ora'};
  const rC={caldo:'#993C1D',possibile:'#854F0B',nonora:'#9a9890'};
  const rated=PKEYS.filter(k=>S.callRatings[k]);
  if(!rated.length)return'<div style="font-size:11px;color:var(--t2)">Nessuna profilazione compilata sopra</div>';
  return rated.map(k=>`<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--bd)"><span class="chip ${PCLS[k]}" style="font-size:11px">${PNAMES[k]}</span><span style="margin-left:auto;font-size:11px;font-weight:500;color:${rC[S.callRatings[k]]}">${rL[S.callRatings[k]]}</span></div>`).join('');
}
function cosaDopo(pk,esito){
  const notified=PKEYS.filter(k=>k!==pk&&S.callRatings[k]&&S.callRatings[k]!=='nonora');
  if(esito==='parlato'){
    let lines=['→ Contatto aggiornato nella lista'];
    if(notified.length)lines.push('→ Briefing a <strong>'+notified.map(k=>PNAMES[k]).join(', ')+'</strong>');
    if(notified.length)lines.push('→ Bacheca notificata al team');
    else lines.push('→ Nessun briefing (nessun interesse trasversale)');
    return lines.map(l=>'<div style="font-size:12px;color:var(--t2);line-height:1.8">'+l+'</div>').join('');
  }
  if(esito==='richiama')return'<div style="font-size:12px;color:var(--t2)">Nessun briefing — contatto torna in lista come <strong>Richiamare</strong></div>';
  if(esito==='nonrisponde')return'<div style="font-size:12px;color:var(--t2)">Contatto segnato come <strong>Non risponde</strong> — nessun briefing inviato</div>';
  if(esito==='chiuso')return'<div style="font-size:12px;color:var(--t2)">Contatto chiuso. I colleghi con interesse aperto vengono avvisati in bacheca.</div>';
  return'<div style="font-size:12px;color:var(--t3)">Seleziona un esito per vedere cosa succede</div>';
}
function setEsito(e){
  S.callEsito=e;
  document.querySelectorAll('.esito-opt').forEach(b=>{b.classList.remove('sel-parlato','sel-richiama','sel-nr','sel-chiuso');});
  const btn=document.getElementById('esito-'+e);
  if(btn)btn.classList.add('sel-'+e);
  const dw=document.getElementById('callback-wrap');
  if(dw)dw.style.display=e==='richiama'?'block':'none';
  const dopo=document.getElementById('cosa-dopo');
  if(dopo)dopo.innerHTML=cosaDopo(S.user,e);
  refreshCloseBtnGate();
}
function quickC2CHtml(pk,c){

    const checked=S.callRatings[k]==='possibile';
    return '<label style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);cursor:pointer;font-size:13px">'
      +'<input type="checkbox" id="quick-'+k+'"'+(checked?' checked':'')+' onchange="toggleQuickInterest(\''+k+'\',this.checked)" style="width:16px;height:16px">'
      +'<span class="chip '+PCLS[k]+'">'+PNAMES[k]+'</span>'
      +'</label>';
  }).join('');
  const askYes=S.c2cAsked==='si', askNo=S.c2cAsked==='no';
  const yesStyle=askYes?'padding:10px 4px;border-radius:8px;border:1.5px solid #185FA5;background:#E6F1FB;font-size:12px;font-weight:600;cursor:pointer;color:#0F3D6B':'padding:10px 4px;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);font-size:12px;font-weight:500;cursor:pointer;color:var(--text)';
  const noStyle=askNo?'padding:10px 4px;border-radius:8px;border:1.5px solid var(--bd2);background:var(--card2);font-size:12px;font-weight:600;cursor:pointer;color:var(--text)':'padding:10px 4px;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);font-size:12px;font-weight:500;cursor:pointer;color:var(--text)';
  const answered=S.c2cAsked==='si'||S.c2cAsked==='no';
  const tagHtml=S.callC2CRequired
    ?'<span style="color:#B3471F;font-weight:700">\u00b7 obbligatorio</span>'
    :'<span style="color:var(--t3);font-weight:600">\u00b7 facoltativo \u2014 gi\u00e0 discusso dal collega</span>';
  const showHint=S.callC2CRequired&&!answered;
  return '<div class="clabel" style="margin-bottom:4px;margin-top:14px">\u{1F4E2} Altri interessi emersi in telefonata '+tagHtml+'</div>'
    +'<div style="font-size:11px;color:var(--t2);margin-bottom:8px;line-height:1.5">Durante la chiamata \u00e8 emerso interesse anche per altri prodotti del gruppo?</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px">'
    +'<button id="c2c-ask-si" onclick="setC2CAsked(\'si\')" style="'+yesStyle+'">S\u00ec, \u00e8 emerso interesse</button>'
    +'<button id="c2c-ask-no" onclick="setC2CAsked(\'no\')" style="'+noStyle+'">No, solo l\'interesse iniziale</button>'
    +'</div>'
    +'<div id="quick-checklist-wrap" style="display:'+(askYes?'block':'none')+'">'
    +rows
    +'</div>'
    +'<div id="c2c-gate-hint" style="font-size:11px;color:#993C1D;margin-top:4px;display:'+(showHint?'block':'none')+'">\u26a0\ufe0f Rispondi per poter chiudere la chiamata</div>';
}
function setC2CAsked(val){
  S.c2cAsked=val;
  const wrap=document.getElementById('quick-checklist-wrap');
  if(val==='no'){
    PKEYS.forEach(k=>{
      const el=document.getElementById('quick-'+k);
      if(el&&el.checked){el.checked=false;}
      S.callRatings[k]=(S.callRatings[k]==='possibile')?'':S.callRatings[k];
    });
    if(wrap)wrap.style.display='none';
  } else if(val==='si'){
    if(wrap)wrap.style.display='block';
  }
  const yesBtn=document.getElementById('c2c-ask-si');
  const noBtn=document.getElementById('c2c-ask-no');
  const yesStyle=val==='si'?'padding:10px 4px;border-radius:8px;border:1.5px solid #185FA5;background:#E6F1FB;font-size:12px;font-weight:600;cursor:pointer;color:#0F3D6B':'padding:10px 4px;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);font-size:12px;font-weight:500;cursor:pointer;color:var(--text)';
  const noStyle=val==='no'?'padding:10px 4px;border-radius:8px;border:1.5px solid var(--bd2);background:var(--card2);font-size:12px;font-weight:600;cursor:pointer;color:var(--text)':'padding:10px 4px;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);font-size:12px;font-weight:500;cursor:pointer;color:var(--text)';
  if(yesBtn)yesBtn.style.cssText=yesStyle;
  if(noBtn)noBtn.style.cssText=noStyle;
  refreshRecap();
  refreshCloseBtnGate();
}
function toggleQuickInterest(k,isChecked){
  S.callRatings[k]=isChecked?'possibile':'';
  refreshRecap();
  refreshCloseBtnGate();
}
function refreshRecap(){
  const el=document.getElementById('profilazione-recap');
  if(!el)return;
  let html=profilazioneRecap(S.user);
  if(S.c2cAsked==='no')html+='<div style="font-size:11px;color:var(--t2);padding:5px 0 0">Nessun altro interesse rilevato in telefonata</div>';
  el.innerHTML=html;
}
function c2cGateOk(){
  if(!S.callC2CRequired)return true;
  return S.c2cAsked==='no'||(S.c2cAsked==='si'&&PKEYS.some(k=>S.callRatings[k]==='possibile'));
}
function refreshCloseBtnGate(){
  const btn=document.getElementById('close-call-btn');
  if(!btn)return;
  const hint=document.getElementById('c2c-gate-hint');
  const ok=c2cGateOk();
  if(hint)hint.style.display=(S.callC2CRequired&&!ok)?'block':'none';
  const ready=!!S.callEsito&&ok;
  btn.disabled=!ready;
  btn.style.opacity=ready?'1':'.4';

function updateItaAssignUI(){
  const checked=PKEYS.filter(k=>{const el=document.getElementById('mix-'+k);return el&&el.checked;});
  const refBlock=document.getElementById('ita-referente-block');
  const btn=document.getElementById('ita-assign-btn');
  if(!btn)return;
  if(checked.length===0){
    if(refBlock)refBlock.style.display='none';
    btn.disabled=true;btn.style.opacity='.4';btn.style.background='';
    btn.textContent='Seleziona almeno un partner';
  } else if(checked.length===1){
    if(refBlock)refBlock.style.display='none';
    btn.disabled=false;btn.style.opacity='1';btn.style.background='';
    btn.textContent='Chiudi e riassegna a '+PNAMES[checked[0]]+' →';
  } else {
    if(refBlock)refBlock.style.display='block';
    btn.disabled=false;btn.style.opacity='1';btn.style.background='#7F77DD';
    btn.textContent='Chiudi e assegna a più partner →';
  }
}

</div>
</div>`}

// ── CALLER ACTIONS ──────────────────────────────────────────────
function setRating(partner,rating){
  S.callRatings[partner]=rating;
  document.querySelectorAll(`[data-p="${partner}"]`).forEach(b=>b.classList.remove('act','caldo','possibile','nonora'));
  const btn=document.querySelector(`[data-p="${partner}"][data-r="${rating}"]`);
  if(btn)btn.classList.add('act',rating);
}
function toggleConcrete(){S.callConcrete=!S.callConcrete;const btn=document.querySelector('.concrete-btn');if(btn){btn.classList.toggle('on',S.callConcrete);btn.textContent=S.callConcrete?'★ CLIENTE CONCRETO — progetto reale in corso':'☆ Segna come cliente concreto'}}
function startEdit(id,field){
  const c=allContacts().find(x=>x.id===id);
  const cur=getField(c,field)||'';
  const spanId=(field==='t'?'tel':'mail')+'-display-'+id;
  const span=document.getElementById(spanId);
  if(!span)return;
  const typ=field==='t'?'tel':'email';
  span.innerHTML='<input id="ei-'+id+'" type="'+typ+'" value="'+cur+'"'+'style="border:1px solid var(--bd);border-radius:6px;padding:3px 8px;font-size:12px;background:var(--card);color:var(--text);width:160px"/>'+'<button onclick="confirmEdit('+id+',\''+field+'\')" '+'style="border:none;background:none;color:var(--blue);cursor:pointer;font-size:12px;padding:0 6px">✓</button>'+'<button onclick="cancelEdit()" '+'style="border:none;background:none;color:var(--t3);cursor:pointer;font-size:12px;padding:0 4px">✕</button>';
  setTimeout(()=>{const i=document.getElementById('ei-'+id);if(i)i.focus();},50);
}
function confirmEdit(id,field){
  const inp=document.getElementById('ei-'+id);
  if(!inp)return;
  const value=inp.value.trim();
  const apiField=field==='t'?'telefono':'email';
  apiChain([()=>apiPost('editContact',{partner:S.user,contactId:id,field:apiField,value})]);
}
function cancelEdit(){render();}
function closeSheet(){S.modal=null;S.activeId=null;S.callRatings={};S.callConcrete=false;S.callDoc='';S.callNote='';S.callEsito='';S.c2cAsked='';S.callC2CRequired=true;render();}
function saveCallTriage(){
  const id=S.activeId;
  const partners=PKEYS.filter(k=>{const el=document.getElementById('mix-'+k);return el&&el.checked;});
  if(!partners.length){alert('Seleziona almeno un partner');return}
  const dateStr=new Date().toLocaleDateString('it-IT');
  const c=allContacts().find(x=>x.id===id);
  if(partners.length===1){
    const newPartner=partners[0];
    const steps=[
      ()=>apiPost('saveCall',{partner:'ita',contactId:id,ratings:{...S.callRatings},concrete:S.callConcrete,doc:S.callDoc,note:S.callNote,callDate:dateStr,reassignedTo:newPartner}),
      ()=>apiPost('assign',{pin:S.adminPin||ADMIN_PIN,contactId:id,partner:newPartner})
    ];
    apiChain(steps,()=>{closeSheet();});
    return;
  }
  const referente=document.getElementById('mix-ita-referente')?document.getElementById('mix-ita-referente').checked:false;
  const det=partners.map(k=>PNAMES[k]).join(', ');
  const txt=(c?c.n+' '+c.c:'Contatto')+' — progetto misto: coinvolti '+det+(referente?' · ITA referente unico':'');
  const steps=[
    ()=>apiPost('saveCall',{partner:'ita',contactId:id,ratings:{...S.callRatings},concrete:S.callConcrete,doc:S.callDoc,note:S.callNote,callDate:dateStr,mixed:true,mixedPartners:partners,mixedReferente:referente}),
    ()=>apiPost('saveMixed',{partner:'ita',contactId:id,partners:partners,referente:referente,note:S.callNote,date:dateStr}),
    ()=>apiPost('assign',{pin:S.adminPin||ADMIN_PIN,contactId:id,partner:'ita'}),
    ()=>apiPost('sendMessage',{autore:'ITA',testo:txt,auto:true})
  ];
  apiChain(steps,()=>{closeSheet();});
}
function saveCall(pk){
  const id=S.activeId;
  if(!S.callEsito){alert('Seleziona l\'esito della chiamata prima di chiudere');return}
  const callbackDate=S.callEsito==='richiama'?(document.getElementById('callback-date')?.value||''):'';
  const c=allContacts().find(x=>x.id===id);
  const c2cConsent=document.getElementById('c2c-consent')?.checked!==false;
  const callDateStr=new Date().toLocaleDateString('it-IT');
  const steps=[
    ()=>apiPost('saveCall',{partner:pk,contactId:id,ratings:{...S.callRatings},concrete:S.callConcrete,doc:S.callDoc,note:S.callNote,esito:S.callEsito,callbackDate,callDate:callDateStr,consent:c2cConsent})
  ];
  // Il server non genera messaggi in bacheca da solo — li mandiamo qui, come faceva prima l'app
  if(S.callEsito==='parlato'&&c){
    const rL={caldo:'Confermato',possibile:'Possibile'};
    const notified=PKEYS.filter(k=>k!==pk&&S.callRatings[k]&&S.callRatings[k]!=='nonora');
    if(notified.length&&c2cConsent){
      const det=notified.map(k=>PNAMES[k]+' ('+rL[S.callRatings[k]]+')').join(', ');
      const txt=c.n+' '+c.c+' segnalato a '+det+(S.callNote?' · "'+S.callNote+'"':'');
      steps.push(()=>apiPost('sendMessage',{autore:PNAMES[pk],testo:txt,auto:true}));
    }
    if(S.callConcrete){
      const txt2=c.n+' '+c.c+' — cliente concreto ★ Progetto reale in corso';
      steps.push(()=>apiPost('sendMessage',{autore:PNAMES[pk],testo:txt2,auto:true}));
    }
  }
  apiChain(steps,()=>{closeSheet();});
}

function filterSearch(val){
  const q=val.toLowerCase().trim();
  let anyVisible=false;
  document.querySelectorAll('.ci[data-cid]').forEach(el=>{
    const cid=parseInt(el.dataset.cid);
    const c=allContacts().find(x=>x.id===cid);
    if(!c){el.style.display='none';return;}
    const match=!q||(c.n+' '+c.c).toLowerCase().includes(q)||(c.az||'').toLowerCase().includes(q)||(c.m||'').toLowerCase().includes(q);
    el.style.display=match?'':'none';
    if(match)anyVisible=true;
  });
  const empty=document.getElementById('search-empty');
  if(empty)empty.style.display=(!anyVisible&&q)?'block':'none';
  const clr=document.getElementById('search-clear');
  if(clr)clr.style.display=q?'':'none';
}
function clearSearch(){
  const inp=document.getElementById('search-inp');
  if(inp){inp.value='';filterSearch('');inp.focus();}
}
function openSignalModal(cid){
  S.signalModal=cid;
  render();
}
function bindSignalModal(pk){
  const ov=document.getElementById('sig-overlay');
  const sc=document.getElementById('sig-close');
  const cf=document.getElementById('sig-confirm');
  if(ov)ov.onclick=e=>{if(e.target===ov){S.signalModal=null;render();}};
  if(sc)sc.onclick=()=>{S.signalModal=null;render();};
  if(cf)cf.onclick=()=>{
    const note=(document.getElementById('sig-note')?.value||'').trim();
    const targets=PKEYS.filter(k=>k!==pk&&document.getElementById('sig-'+k)?.checked);
    if(!targets.length){alert('Seleziona almeno un partner');return;}
    const cid=S.signalModal;
    const c=allContacts().find(x=>x.id===cid);
    const dateStr=new Date().toLocaleDateString('it-IT');
    const steps=targets.map(k=>()=>apiPost('addSignal',{contactId:cid,from:pk,to:k,note,date:dateStr,livello:'possibile'}));
    targets.forEach(k=>{
      const nome=c?c.n+' '+c.c:'Contatto';
      steps.push(()=>apiPost('sendMessage',{autore:PNAMES[pk],testo:nome+' segnalato a '+PNAMES[k]+(note?' · "'+note+'"':''),auto:true}));
    });
    apiChain(steps,()=>{S.signalModal=null;render();});
  };
}
function openBacheca(){
  S.callerTab='bacheca';
  S.msgsSeen=S.msgs.length;
  lsave('msgsSeen_'+S.user,S.msgsSeen);
  render();
}
function bindCaller(){
  if(document.getElementById('ita-assign-btn'))updateItaAssignUI();
  const lb=document.getElementById('logout-btn');
  if(lb)lb.onclick=()=>{S.user=null;S.dataStatus='idle';lsave('user',null);if(window.location.hash)history.replaceState(null,'',window.location.pathname+window.location.search);render()};
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    S.callerTab=t.dataset.tab;
    if(t.dataset.tab==='bacheca'){S.msgsSeen=S.msgs.length;lsave('msgsSeen_'+S.user,S.msgsSeen);}
    render();
  });
  document.querySelectorAll('.ci[data-cid]').forEach(item=>item.onclick=()=>{
    if(S.callerFirstTime){S.callerFirstTime=false;lsave('seen_'+S.user,true);}
    S.activeId=parseInt(item.dataset.cid);
    const existing=S.results[rkey(S.activeId,S.user)];
    S.callRatings=existing?.ratings?{...existing.ratings}:{};
    S.callConcrete=existing?.concrete||false;
    S.callDoc=existing?.doc||'';
    S.callNote=existing?.note||'';
    S.c2cAsked='';
    S.callC2CRequired=!((S.signals[S.activeId]||[]).some(sg=>sg.to===S.user&&sg.consent));
    S.modal='callsheet';render();
  });
  const msend=document.getElementById('msg-send');
  if(msend)msend.onclick=()=>{
    const inp=document.getElementById('msg-in');
    const txt=(inp?.value||'').trim();
    if(!txt)return;
    apiChain([()=>apiPost('sendMessage',{autore:PNAMES[S.user]||S.user,testo:txt,auto:false})],()=>{
      inp.value='';render();
      setTimeout(()=>document.querySelector('.bacheca-end')?.scrollIntoView(),50);
    });
  };
}

// ── BOOT ──────────────────────────────────────────────
loadState();
if(S.user){reloadData();}else{render();}
</script>
